---

- name: Install required packages
  ansible.builtin.apt:
    name:
      - wget
      - tar
    state: present
    update_cache: yes

- name: Download etcd binary
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: "/tmp/etcd.tar.gz"

- name: Extract etcd binary
  ansible.builtin.unarchive:
    src: "/tmp/etcd.tar.gz"
    dest: "/opt/"
    remote_src: yes

- name: Copy etcd binaries
  ansible.builtin.copy:
    src: "/opt/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    remote_src: yes
  loop:
    - etcd
    - etcdctl

- name: Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create etcd systemd service
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: '0644'

- name: Set etcd endpoints as comma-separated list
  ansible.builtin.set_fact:
    etcd_endpoints: "{{ etcd_cluster_nodes | map(attribute='ansible_host') | map('regex_replace', '^(.*)$', 'http://\\1:2379') | join(',') }}"

- name: Create etcdctl environment script
  ansible.builtin.copy:
    dest: /etc/profile.d/etcdctl.sh
    content: |
      #!/bin/bash
      export ENDPOINTS={{ etcd_endpoints }}
    owner: root
    group: root
    mode: '0755'

- name: Reload systemd and enable etcd
  ansible.builtin.systemd:
    daemon_reload: yes
    name: etcd
    enabled: yes
    state: restarted

- name: Check etcd endpoints
  ansible.builtin.command:
    cmd: etcdctl endpoint status -w=table

